name: Distribution checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.scope.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: make check
      - name: Classify image changes conservatively
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 build/tools/ci-scope.py --event "$EVENT" --base "$BASE" --head "$HEAD" >> "$GITHUB_OUTPUT"
  image:
    if: needs.contracts.outputs.images == 'true'
    strategy:
      fail-fast: false
      matrix:
        profile: [agent, inference]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    needs: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make PROFILE=${{ matrix.profile }} HARDWARE=cpu builder build smoke package
      - name: Qualify the packaged worker on its own kernel
        run: |
          if [ '${{ matrix.profile }}' = agent ]; then
            make PROFILE=agent HARDWARE=cpu agent-resources
          else
            make PROFILE=inference HARDWARE=cpu enrollment
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: outerspace-${{ matrix.profile }}-cpu-${{ matrix.arch }}-development
          path: |
            out/${{ matrix.profile }}-cpu-${{ matrix.arch }}/outerspace-*/*.json
            out/${{ matrix.profile }}-cpu-${{ matrix.arch }}/*.manifest
            out/${{ matrix.profile }}-cpu-${{ matrix.arch }}/*.log
            out/${{ matrix.profile }}-cpu-${{ matrix.arch }}/enrollment.json
            out/${{ matrix.profile }}-cpu-${{ matrix.arch }}/enrollment-*.json
            out/${{ matrix.profile }}-cpu-${{ matrix.arch }}/agent-isolation*.json
            out/${{ matrix.profile }}-cpu-${{ matrix.arch }}/agent-resources.json
          retention-days: 7
  ci:
    name: ci
    if: always()
    needs: [contracts, image]
    runs-on: ubuntu-24.04
    steps:
      - name: Require contracts and the appropriate image qualification
        env:
          CONTRACTS: ${{ needs.contracts.result }}
          IMAGES_REQUIRED: ${{ needs.contracts.outputs.images }}
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          test "$CONTRACTS" = success
          if [ "$IMAGES_REQUIRED" = true ]; then
            test "$IMAGE_RESULT" = success
          else
            test "$IMAGES_REQUIRED" = false
            test "$IMAGE_RESULT" = skipped
          fi
