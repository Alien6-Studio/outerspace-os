[Config]
MinimumVersion=25.3

[Distribution]
Distribution=ubuntu
Release=noble
Repositories=main,universe

[Output]
Format=disk
ImageId=outerspace
Output=outerspace
OutputDirectory=/out
ManifestFormat=json
CompressOutput=no

[Content]
Bootable=yes
Bootloader=systemd-boot
WithDocs=no
WithRecommends=no
CleanPackageMetadata=yes
Packages=systemd-sysv
         systemd-boot-efi
         systemd-resolved
         systemd-timesyncd
         udev
         dbus
         linux-image-6.8.0-147-generic=6.8.0-147.147
         linux-modules-extra-6.8.0-147-generic=6.8.0-147.147
         ca-certificates
         libseccomp2
         runc
         iproute2
         iptables
         conntrack
         ethtool
         kmod
         e2fsprogs
         apparmor
         libapparmor1
         hostname
         procps
         auditd
KernelCommandLine=ro
                  console=tty0
                  console=ttyS0,115200
                  console=ttyAMA0,115200
                  systemd.verity=1
                  lsm=landlock,lockdown,yama,integrity,apparmor,bpf
                  apparmor=1
                  audit=1
                  audit_backlog_limit=8192
                  vsyscall=none
                  init_on_alloc=1
                  init_on_free=1
                  page_alloc.shuffle=1
                  slab_nomerge
                  randomize_kstack_offset=on

[Validation]
SecureBoot=no

[Build]
WithNetwork=yes
CacheDirectory=/cache
PackageCacheDirectory=/cache/packages
Incremental=no
