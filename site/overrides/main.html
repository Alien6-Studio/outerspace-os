{% extends "base.html" %}
{% block extrahead %}
<meta property="og:type" content="website">
<meta property="og:title" content="{{ page.title if page else "Page not found" }} — OuterSpace OS">
<meta property="og:description" content="{{ page.meta.description | default(config.site_description) if page else config.site_description }}">
<meta property="og:url" content="{{ page.canonical_url if page else config.site_url }}">
<meta property="og:image" content="{{ config.site_url }}assets/images/illustration.png">
<meta name="theme-color" content="#10101b">
{% endblock %}
{% block footer %}
{{ super() }}
<a class="os-doc-footer" href="https://alien6.com" target="_blank" rel="noopener noreferrer">OuterSpace OS · by <img src="{{ 'assets/images/alien6.png' | url }}" alt="Alien6" width="112" height="50"></a>
{% endblock %}
