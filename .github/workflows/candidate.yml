name: Candidate images
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, e.g. v0.1.0-alpha.1
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        profile: [agent, inference]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Validate candidate identity
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('release', 'scripts/release.py')
          release = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(release)
          version = Path('VERSION').read_text().strip()
          assert release.parse_version(version) != 'dev', 'Development snapshots are not candidates'
          assert os.environ['TAG'] == 'v' + version, 'Tag must match VERSION'
          PY
      - run: make PROFILE=${{ matrix.profile }} HARDWARE=cpu check builder build smoke package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ matrix.profile }}-cpu-${{ matrix.arch }}
          path: build/${{ matrix.profile }}-cpu-${{ matrix.arch }}/outerspace-*/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: failed-boot-${{ matrix.profile }}-cpu-${{ matrix.arch }}
          path: build/${{ matrix.profile }}-cpu-${{ matrix.arch }}/*.log
          retention-days: 7
