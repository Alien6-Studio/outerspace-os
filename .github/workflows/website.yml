name: Website build
on:
  push:
    branches: [gh-pages]
  pull_request:
    branches: [gh-pages]
permissions:
  contents: read
jobs:
  site-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 -m venv "$RUNNER_TEMP/website"
          "$RUNNER_TEMP/website/bin/pip" install -r site/requirements.txt
          "$RUNNER_TEMP/website/bin/mkdocs" build --strict -f site/mkdocs.yml --site-dir "$RUNNER_TEMP/html"
