name: Candidate images
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, e.g. v0.1.0-alpha.1
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: candidate-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Validate candidate identity
        run: |
          python3 - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('build/tools').resolve()))
          import release
          version = Path('VERSION').read_text().strip()
          assert release.parse_version(version) != 'dev', 'Development snapshots are not candidates'
          assert os.environ['TAG'] == 'v' + version, 'Tag must match VERSION'
          assert os.environ['GITHUB_REF'] == 'refs/tags/' + os.environ['TAG'], 'Dispatch this workflow at the candidate tag'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['GITHUB_SHA'], 'Workflow and source must be the same revision'
          PY
      - name: Review Dependabot alerts before image builds
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo 'Configure DEPENDABOT_ALERTS_TOKEN with read-only Dependabot alerts access.' >&2; exit 1; }
          python3 build/tools/dependabot_preflight.py --repo "$GH_REPO" --commit "$GITHUB_SHA" --report out/dependabot-preflight.json
      - name: Run AMD64 contracts
        run: make check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: candidate-dependabot-preflight
          path: out/dependabot-preflight.json
          if-no-files-found: ignore
          retention-days: 30
  contracts_arm64:
    needs: preflight
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Run ARM64 contracts
        run: make check
  build:
    needs: [preflight, contracts_arm64]
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        profile: [agent, inference]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - run: make PROFILE=${{ matrix.profile }} HARDWARE=cpu builder build smoke package
      - name: Require the supply-chain release decisions
        run: make PROFILE=${{ matrix.profile }} HARDWARE=cpu security-gate
      - name: Qualify workloads on the exact candidate image
        run: |
          if [ '${{ matrix.profile }}' = agent ]; then
            make PROFILE=agent HARDWARE=cpu agent-resources
          else
            make PROFILE=inference HARDWARE=cpu cpu-serving
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-${{ matrix.profile }}-cpu-${{ matrix.arch }}
          path: |
            out/${{ matrix.profile }}-cpu-${{ matrix.arch }}/enrollment*.json
            out/${{ matrix.profile }}-cpu-${{ matrix.arch }}/agent-isolation*.json
            out/${{ matrix.profile }}-cpu-${{ matrix.arch }}/agent-resources*.json
            out/${{ matrix.profile }}-cpu-${{ matrix.arch }}/cpu-serving*.json
            out/${{ matrix.profile }}-cpu-${{ matrix.arch }}/*.log
          if-no-files-found: error
          retention-days: 30
      - name: Sign the immutable checksum inventory
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/${{ matrix.profile }}-cpu-${{ matrix.arch }}/outerspace-*/SHA256SUMS
      - name: Preserve the offline verification bundle
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" out/${{ matrix.profile }}-cpu-${{ matrix.arch }}/candidate-attestation.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ matrix.profile }}-cpu-${{ matrix.arch }}
          path: |
            out/${{ matrix.profile }}-cpu-${{ matrix.arch }}/outerspace-*/
            out/${{ matrix.profile }}-cpu-${{ matrix.arch }}/candidate-attestation.jsonl
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: failed-qualification-${{ matrix.profile }}-cpu-${{ matrix.arch }}
          path: |
            out/${{ matrix.profile }}-cpu-${{ matrix.arch }}/*.log
            out/${{ matrix.profile }}-cpu-${{ matrix.arch }}/*review.json
            out/${{ matrix.profile }}-cpu-${{ matrix.arch }}/vulnerabilities.grype.json
            out/${{ matrix.profile }}-cpu-${{ matrix.arch }}/kernel-vulnerabilities.grype.json
            out/${{ matrix.profile }}-cpu-${{ matrix.arch }}/source-index.json
          retention-days: 7
