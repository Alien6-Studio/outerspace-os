site_name: OuterSpace OS
site_url: https://os.outerspace.sh/
site_author: Alien6
site_description: An immutable Linux OS for Kubernetes workers running AI agents and inference.
repo_name: Alien6-Studio/outerspace-os
repo_url: https://github.com/Alien6-Studio/outerspace-os
copyright: OuterSpace OS — by Alien6.
strict: true
theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/outerspace-mark.svg
  favicon: assets/images/outerspace-mark.svg
  font: false
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
extra_css:
  - assets/stylesheets/docs.css
extra:
  generator: false
  version: 0.1.0-alpha.1
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Alien6-Studio/outerspace-os
nav:
  - Home: index.md
  - Explore OuterSpace OS:
      - Overview: introduction.md
      - How it works: architecture.md
      - Get started: getting-started.md
      - Agent and Inference: features.md
      - Releases: releases.md
      - Security: security.md
      - FAQ: faq.md
